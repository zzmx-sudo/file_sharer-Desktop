name: Pull Request Build

on:
  pull_request:
    branches:
      - master

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 days'

  Build-Win-x64:
    name: Build-Win-x64
    runs-on: windows-latest
    steps:
      - name: Clone code
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          architecture: 'x64'

      - name: Install Dependencies with pip
        run: pip install -r requirements.txt

      - name: Install NSIS and 7Z
        run: |
          choco install nsis -y
          choco install 7zip -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Set code page to UTF-8
        run: chcp 65001

      - name: Gen Current ChangeLog
        run: |
          cd .\scripts
          python generate_cur_changelog.py

      - name: Compress windows Binary
        run: |
          cd .\scripts
          python modify_script_file.py
          .\build_windows_x64.bat

          if (-not (Test-Path ..\build\installer\file_sharer-desktop_v*-win_x64.exe)) {
            throw "Windows x64 installer (.exe) was not generated."
          }
          if (-not (Test-Path ..\build\installer\file_sharer-desktop_v*-win_x64-green.7z)) {
            throw "Windows x64 portable archive (.7z) was not generated."
          }

          Write-Host "Windows x64 build artifacts verified:"
          Get-ChildItem ..\build\installer\file_sharer-desktop_v*-win_x64.exe, ..\build\installer\file_sharer-desktop_v*-win_x64-green.7z |
            ForEach-Object { Write-Host "  $($_.FullName)" }

  Build-Win-x86:
    name: Build-Win-x86
    runs-on: windows-latest
    steps:
      - name: Clone code
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Install Dependencies with pip
        run: pip install -r requirements.txt

      - name: Install NSIS and 7Z
        run: |
          choco install nsis -y
          choco install 7zip -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Set code page to UTF-8
        run: chcp 65001

      - name: Compress windows Binary
        run: |
          cd .\scripts
          python modify_script_file.py
          .\build_windows_x86.bat

          if (-not (Test-Path ..\build\installer\file_sharer-desktop_v*-win_x86.exe)) {
            throw "Windows x86 installer (.exe) was not generated."
          }
          if (-not (Test-Path ..\build\installer\file_sharer-desktop_v*-win_x86-green.7z)) {
            throw "Windows x86 portable archive (.7z) was not generated."
          }

          Write-Host "Windows x86 build artifacts verified:"
          Get-ChildItem ..\build\installer\file_sharer-desktop_v*-win_x86.exe, ..\build\installer\file_sharer-desktop_v*-win_x86-green.7z |
            ForEach-Object { Write-Host "  $($_.FullName)" }

  Build-MacOs-x64:
    name: Build-MacOs-x64
    runs-on: macos-15-intel
    steps:
      - name: Clone code
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install Dependencies with pip
        run: pip install -r requirements.txt

      - name: Install Create-dmg
        run: brew install create-dmg

      - name: Compress Macos Binary
        run: |
          cd ./scripts
          python modify_script_file.py
          bash build_mac.sh x64

          if ! compgen -G "../build/installer/file_sharer-desktop_v*-macos-x64.dmg" > /dev/null; then
            echo "macOS x64 disk image (.dmg) was not generated." >&2
            exit 1
          fi

          echo "macOS x64 build artifact verified:"
          printf '  %s\n' ../build/installer/file_sharer-desktop_v*-macos-x64.dmg

  Build-MacOs-arm64:
    name: Build-MacOs-arm64
    runs-on: macos-latest
    steps:
      - name: Clone code
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install Dependencies with pip
        run: pip install -r requirements.txt

      - name: Install Create-dmg
        run: brew install create-dmg

      - name: Compress Macos Binary
        run: |
          cd ./scripts
          python modify_script_file.py
          bash build_mac.sh arm64

          if ! compgen -G "../build/installer/file_sharer-desktop_v*-macos-arm64.dmg" > /dev/null; then
            echo "macOS arm64 disk image (.dmg) was not generated." >&2
            exit 1
          fi

          echo "macOS arm64 build artifact verified:"
          printf '  %s\n' ../build/installer/file_sharer-desktop_v*-macos-arm64.dmg
